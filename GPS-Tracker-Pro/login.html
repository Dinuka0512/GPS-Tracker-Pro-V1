<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tracker Pro — Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3b3b'%3E%3Cpath d='M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z'/%3E%3Ccircle cx='12' cy='9' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-mark" style="width:44px;height:44px;"></div>
      <h1>GPS Tracker Pro</h1>
      <span id="authSubtitle">Sign in to your tracking dashboard</span>
    </div>

    <form id="authForm">
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;" id="authSubmitBtn">Sign in</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>

<script>
  // Sign-in backed by Firebase Authentication.
  const form = document.getElementById("authForm");
  const errorEl = document.getElementById("authError");
  const submitBtn = document.getElementById("authSubmitBtn");

  GPSApp.redirectIfAuthed();

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    submitBtn.disabled = true;

    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;

    GPSApp.auth.signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = "index.html"; })
      .catch((err) => {
        errorEl.textContent = friendlyAuthError(err);
        submitBtn.disabled = false;
      });
  });

  function friendlyAuthError(err) {
    const map = {
      "auth/invalid-email": "That email address looks invalid.",
      "auth/user-not-found": "No account found with that email.",
      "auth/wrong-password": "Incorrect password.",
      "auth/email-already-in-use": "An account with that email already exists.",
      "auth/weak-password": "Password should be at least 6 characters."
    };
    return map[err.code] || err.message || "Something went wrong. Please try again.";
  }
</script>

</body>
</html>
